#@TYPE: Machine
#@NAME: ebaz4205-zynq7
#@DESCRIPTION: Machine configuration for the Ebang EBAZ4205 (Zynq-7010)
#
# Xilinx Zynq 7Z010 board originally sold as a cryptominer controller.
# This config targets SD-card boot with mainline-style device tree and
# builds U-Boot SPL as the first-stage bootloader (boot.bin) using the
# EBAZ4205-specific ps7_init_gpl.[ch] from recipes-bsp/platform-init/.

#### Preamble
MACHINEOVERRIDES =. "${@['', 'ebaz4205-zynq7:']['ebaz4205-zynq7' != '${MACHINE}']}"

# Generic Zynq-7000 defaults from meta-xilinx-core
require conf/machine/zynq-generic.conf

SOC_VARIANT = "7z"

# Linux kernel device tree from linux-xlnx (arch/arm/boot/dts/xilinx/)
KERNEL_DEVICETREE = "xilinx/zynq-ebaz4205.dtb"

# U-Boot: generic Xilinx Zynq virt defconfig; our bbappend patches in the
# zynq-ebaz4205 DTS and adds it to CONFIG_OF_LIST.
UBOOT_MACHINE = "xilinx_zynq_virt_defconfig"

# Force overriding u-boot's default ps7_init files with ours (via
# virtual/xilinx-platform-init provided by recipes-bsp/platform-init).
FORCE_PLATFORM_INIT = "1"

# u-boot-xlnx builds spl/boot.bin directly (SPL acting as FSBL). Point
# virtual/boot-bin at u-boot-xlnx and drop the virtual/fsbl dependency,
# which would otherwise require meta-xilinx-standalone + fsbl-firmware
# (the Xilinx FSBL generated from an XSA, which we do not use).
# Setting SPL_BINARY = "boot.bin" tells u-boot.bbclass to deploy spl/boot.bin
# and triggers the PROVIDES = virtual/boot-bin guard in u-boot-spl-zynq-init.
SPL_BINARY = "spl/boot.bin"
PREFERRED_PROVIDER_virtual/boot-bin = "u-boot-xlnx"
EXTRA_IMAGEDEPENDS:remove = "virtual/fsbl"

# No meta-xilinx-tools/XSA device-tree generator; the DTB comes from the
# kernel package. Clear the generic zynq default so bitbake does not try to
# pull it in via the boot-files machinery.
PREFERRED_PROVIDER_virtual/dtb = ""

SERIAL_CONSOLES = "115200;ttyPS0"
YAML_SERIAL_CONSOLE_BAUDRATE = "115200"

# SD card image. bootimg-partition places IMAGE_BOOT_FILES straight into
# the FAT /boot partition. Our own boot.cmd.ebaz4205 is used by
# u-boot-xlnx-scr to produce boot.scr with the right DTB name.
BOOTMODE = "ebaz4205"
WKS_FILE  = "ebaz4205-sdcard.wks.in"
WKS_FILES = "ebaz4205-sdcard.wks.in"
IMAGE_FSTYPES += "wic wic.bmap"

# zynq-generic.conf appends `wic.qemu-sd`. Its image-types-xilinx-qemu
# class has a filename-extension mismatch with scarthgap image_types_wic
# (expects `.rootfs.wic`, gets `.wic`). We don't run EBAZ in qemu, drop it.
IMAGE_FSTYPES:remove = "wic.qemu-sd"

IMAGE_BOOT_FILES = " \
    boot.bin \
    u-boot.img \
    boot.scr \
    uImage \
    zynq-ebaz4205.dtb \
    ebaz4205-base.bit \
    "

# Pull the FPGA bitstream into the boot partition.
EXTRA_IMAGEDEPENDS += "ebaz4205-bitstream"

MACHINE_FEATURES += "ext2 vfat"

#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' ebaz4205_zynq7']['ebaz4205-zynq7' != '${MACHINE}']}"
